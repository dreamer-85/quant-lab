# Cloud Build for QuantLab ResearchEngine — push-to-deploy pipeline.
#
# Triggered on every push to main (or run manually):
#   1. run the engine test suite
#   2. build + push the image (tagged with the commit SHA and 'latest')
#   3. create-or-update the Cloud Run Job to run that image
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml .
# (set `--substitutions=_TAG=...` to trigger without git)

substitutions:
  _REGION: 'europe-west1'
  _REPO_NAME: 'cloud-run-source-deploy'
  _IMAGE_NAME: 'quant-lab/quant-lab'
  _JOB_NAME: 'quant-lab'
  _BUCKET: 'quant-lab'
  _CPU: '4'
  _MEMORY: '16Gi'
  _TIMEOUT: '24h'

steps:
  # 1. Engine test suite
  - name: 'mcr.microsoft.com/dotnet/sdk:10.0'
    entrypoint: 'dotnet'
    args:
      - 'test'
      - 'Tests/Research/EngineTests/QuantConnect.Research.Engine.Tests.csproj'
      - '-c'
      - 'Release'

  # 2. Build + push the image (tagged with commit SHA and 'latest')
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest'
      - '.'

  # 3. Deploy the image to the Cloud Run Job (idempotent: create or update)
  #    The job mounts the GCS bucket root: /quantlab/data (RO) + /quantlab/output (RW).
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-euc'
      - |
        IMAGE="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA"
        SA="quantlab-runner@$PROJECT_ID.iam.gserviceaccount.com"
        FLAGS=( \
          --image="$$IMAGE" \
          --project=$PROJECT_ID \
          --region=$_REGION \
          --cpu=$_CPU \
          --memory=$_MEMORY \
          --task-timeout=$_TIMEOUT \
          --service-account="$$SA" \
          --add-volume name=data,type=cloud-storage,bucket=$_BUCKET,readonly=true \
          --add-volume-mount volume=data,mount-path=/quantlab/data \
          --add-volume name=output,type=cloud-storage,bucket=$_BUCKET,readonly=false \
          --add-volume-mount volume=output,mount-path=/quantlab/output \
          --set-env-vars=QUANTLAB_DATA_ROOT=/quantlab/data,QUANTLAB_OUTPUT_ROOT=/quantlab/output,QUANTLAB_CACHE_ROOT=/quantlab/cache,QUANTLAB_TEMP_ROOT=/tmp \
          --args=--job-file=/quantlab/data/job.json,--data-dir=/quantlab/data,--output-dir=/quantlab/output \
        )
        if gcloud run jobs describe $_JOB_NAME --project=$PROJECT_ID --region=$_REGION >/dev/null 2>&1; then
          echo "==> Updating Cloud Run Job $_JOB_NAME"
          gcloud run jobs update $_JOB_NAME "${FLAGS[@]}"
        else
          echo "==> Creating Cloud Run Job $_JOB_NAME"
          gcloud run jobs create $_JOB_NAME "${FLAGS[@]}"
        fi

  # 4. Deploy the image to the Cloud Run Service (web mode).
  #    The container ENTRYPOINT is `.../QuantConnect.Research.Runner.dll --web`, so the
  #    service exposes the HTTP API on ${PORT:-8080} and satisfies startup probes.
  #    Shared image, separate shape: jobs run the CLI (they always pass --job-file),
  #    the service runs Kestrel (no --job-file -> web server).
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-euc'
      - |
        IMAGE="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA"
        SA="quantlab-runner@$PROJECT_ID.iam.gserviceaccount.com"
        SVC="quant-lab"
        if ! gcloud run services describe $SVC --project=$PROJECT_ID --region=$_REGION >/dev/null 2>&1; then
          echo "==> Creating Cloud Run Service $SVC"
          gcloud run deploy $SVC \
            --image="$$IMAGE" \
            --project=$PROJECT_ID \
            --region=$_REGION \
            --cpu=$_CPU \
            --memory=$_MEMORY \
            --port=8080 \
            --allow-unauthenticated \
            --service-account="$$SA" \
            --set-env-vars=QUANTLAB_DATA_ROOT=/quantlab/data,QUANTLAB_OUTPUT_ROOT=/quantlab/output,QUANTLAB_CACHE_ROOT=/quantlab/cache,QUANTLAB_TEMP_ROOT=/tmp \
            --add-volume name=data,type=cloud-storage,bucket=$_BUCKET,readonly=true \
            --add-volume-mount volume=data,mount-path=/quantlab/data \
            --add-volume name=output,type=cloud-storage,bucket=$_BUCKET,readonly=false \
            --add-volume-mount volume=output,mount-path=/quantlab/output \
            --quiet
        else
          echo "==> Updating Cloud Run Service $SVC (deleting+redeploying to pick up new image)"
          gcloud run services update $SVC --image="$$IMAGE" --region=$_REGION --quiet
        fi

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest'