[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quatlab-datafeeds"
version = "0.1.0"
description = "DataFeeds: pull crypto + forex market data (historical and live) from OKX, Bybit, Binance and Deriv."
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.6",
]

[project.scripts]
datafeeds = "datafeeds.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datafeeds*"]